trading_mode: paper
log_level: INFO
seed: 42

data:
  fixtures_dir: data/fixtures
  symbols:
    - AAPL
    - VOO
    - QQQ
  timeframe: 1Hour             # resolución principal de datos (1Hour, 1Day, etc.)
  lookback_days: 365           # días de historia a pedir a Alpaca
  extra_timeframes:            # timeframes adicionales para contexto de tendencia
    - 1Day

risk:
  initial_capital: 10000.0
  risk_per_trade: 0.01        # 1% del equity por trade
  stop_loss_pct: 0.04         # 4% stop loss para sizing Kelly-lite
  take_profit_pct: 0.10       # 10% take profit objetivo
  max_drawdown_limit: 0.15    # circuit breaker: para nuevas entradas si DD >= 15%
  max_position_pct: 0.25      # max 25% del equity en un solo símbolo

signals:
  strategy: ml                # trend_follow | mean_reversion | combined | ml
  fast_ma: 9                  # EMA rápida (periodos)
  slow_ma: 21                 # EMA lenta (periodos)
  rsi_period: 14              # periodos para cálculo RSI
  rsi_overbought: 70.0        # RSI por encima = sobrecomprado (filtro SELL)
  rsi_oversold: 30.0          # RSI por debajo = sobrevendido (refuerzo BUY)

colombia:
  apply_fx_risk: true            # Activar módulo de riesgo FX COP/USD
  fx_vol_caution_pct: 5.0       # % cambio 30d que activa modo cautela (reducir posición a 50%)
  fx_vol_block_pct: 10.0        # % cambio 30d que bloquea nuevas entradas
  check_market_hours: true       # Guard: no operar fuera de horario NYSE
  timezone: America/Bogota       # Zona horaria del usuario

ml:
  enabled: true                    # Activar estrategia ML (requiere modelo entrenado)
  model_path: models/signal_classifier.pkl  # Ruta del modelo persistido
  confidence_threshold: 0.45       # Probabilidad mínima para BUY/SELL accionable
  n_splits: 3                      # Splits walk-forward para entrenamiento
  train_pct: 0.70                  # Fracción train por split (rest = OOS)
  forward_horizon: 5               # Barras forward para calcular el target
  target_threshold_pct: 1.0       # % mínimo de movimiento para clasificar BUY/SELL

output:
  state_path: data/portfolio_state.csv
  history_path: data/history.csv
  report_path: logs/report.md
